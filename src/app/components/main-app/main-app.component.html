<div class="container h-100">
    <div class="row h-100">
        <div class="col-2 h-100">
        <div class="row h-100">
            <div class="col border border-5 border-black overflow-hidden">
                <ng-container *ngFor="let sidebarFile of sidebarFiles; index as i">
                    <app-sidebar-file [route]="sidebarFile.name"[isSelected]="sidebarFile.isSelected">{{`${sidebarFile.name}.${sidebarFile.fileExtension}`}}</app-sidebar-file>
                </ng-container>
            </div>
        </div>
        </div>
        <div class="col d-flex flex-column">
            <div class="row">
                <div class="col-4 border border-start-0 border-bottom-0 border-5 border-black fs-4 fw-bold">{{ file_header }}</div>
            </div>
            <div class="row h-100 border border-black border-5 border-start-0">
                <router-outlet />
            </div>
            <div class="row border border-5 border-top-0 border-start-0 border-black">
                <div class="d-flex w-100 h-100">
                    <span class="fw-bold me-2">></span><input type="text" id="retroconsole_input" class="flex-grow-1 border-0"/>
                </div>
            </div>
        </div>
    </div>
</div>
